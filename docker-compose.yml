version: '3.8'

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: supportflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow123
      POSTGRES_DB: supportflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Task Queue ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: supportflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI REST API & LangGraph Orchestrator ──────────────────────────────
  api:
    build: .
    container_name: supportflow_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://supportflow:supportflow123@postgres:5432/supportflow_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama3-8b-8192}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supportflow_super_secret_jwt_key}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-SupportFlowAI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data

  # ─── Redis Background Worker ────────────────────────────────────────────────
  worker:
    build: .
    container_name: supportflow_worker
    restart: unless-stopped
    command: python workers/ticket_worker.py
    environment:
      - DATABASE_URL=postgresql://supportflow:supportflow123@postgres:5432/supportflow_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
